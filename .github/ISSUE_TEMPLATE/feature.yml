name: Feature request
description: Suggest an improvement or a new capability.
title: '[Feature]: '
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: This is a vibecoded personal project. Focused improvements and contributions are welcome; a request does not imply a delivery date. Search existing requests first.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the task you are trying to accomplish and who would benefit.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe how the feature would work from a user's perspective.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or current workaround
  - type: textarea
    id: context
    attributes:
      label: Additional context or mockups
