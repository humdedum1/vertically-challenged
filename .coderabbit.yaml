reviews:
  auto_review:
    # Ticket PRs target dev; CodeRabbit reviews only the default branch otherwise.
    base_branches:
      - "^dev$"
  auto_approvals:
    # Options: minimal, low, moderate, high, critical
    max_merge_risk: low
    # Allows the author to use "@coderabbitai approve" if needed
    allow_author_approval: true
knowledge_base:
  # Store no knowledge-base data (learnings) for this repo.
  opt_out: true
