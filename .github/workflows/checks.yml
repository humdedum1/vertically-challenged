name: Pull request checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: bash .github/release/validate.sh
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:e2e
        env:
          # Runners preset CHROME_BIN to branded Chrome, which ignores --load-extension.
          CHROME_BIN: ''
      # The oldest Firefox the manifest allows (strict_min_version); newer ones only add APIs.
      - name: Firefox smoke test (140)
        run: |
          out=$(npx --yes @puppeteer/browsers install firefox@stable_140.0 --path "$RUNNER_TEMP/firefox" | tail -1)
          FIREFOX_BIN="$RUNNER_TEMP/firefox/${out#* }" npm run test:e2e:firefox
