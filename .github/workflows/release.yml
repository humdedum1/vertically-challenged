# Automatic releases from Conventional Commits (release kit, semantic-versioning skill).
# Project settings: .github/release/config.json   Validation: .github/release/validate.sh
name: Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Dry run (compute version and notes, publish nothing)
        type: boolean
        default: true
      firefox-tag:
        description: Re-run only the Firefox/AMO upload for this existing release tag (e.g. v1.0.5); keep Dry run on so no new version is cut
        type: string
        default: ''

permissions: {}

# One release at a time per branch; a queued run is never cancelled mid-release.
concurrency:
  group: release-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release:
    permissions:
      contents: write
    uses: ./.github/workflows/semantic-release.yml
    with:
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
      node-version: '22'
      dotnet-version: ''
      python-version: ''

  package:
    name: Attach signed CRX ZIP
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm ci
      - name: Pack with the existing extension signing key
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
          CRX_KEY_PATH: ${{ runner.temp }}/extension-signing.pem
        run: |
          test -n "$CRX_PRIVATE_KEY" || { echo 'CRX_PRIVATE_KEY secret is required'; exit 1; }
          umask 077
          trap 'rm -f "$CRX_KEY_PATH"' EXIT
          printf '%s' "$CRX_PRIVATE_KEY" > "$CRX_KEY_PATH"
          unset CRX_PRIVATE_KEY
          npm run pack:crx
      - name: Upload CRX ZIP to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: gh release upload "$RELEASE_TAG" ".output/vertically-challenged-${RELEASE_VERSION}-crx.zip" --clobber

  package-chrome:
    name: Attach Chrome ZIP
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm ci
      # The unsigned zip the Chrome Web Store dashboard takes.
      - run: npm run zip
      - name: Upload Chrome ZIP to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: gh release upload "$RELEASE_TAG" ".output/vertically-challenged-${RELEASE_VERSION}-chrome.zip" --clobber

  package-firefox:
    name: Attach Firefox ZIPs
    needs: release
    if: needs.release.outputs.released == 'true' || inputs.firefox-tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm ci
      # Produces the extension zip and the sources zip AMO asks for.
      - run: npm run zip:firefox
      # Unlisted (the default): signed for self-distribution; the .xpi is attached to the release.
      # Listed (repository variable AMO_CHANNEL=listed): submitted to addons.mozilla.org for review
      # with docs/store/amo-metadata.json. The review isn't waited for, so no .xpi is attached.
      # See docs/store/AMO.md.
      - name: Sign or submit with AMO when credentials exist
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          AMO_CHANNEL: ${{ vars.AMO_CHANNEL }}
        run: |
          if [ -z "$WEB_EXT_API_KEY" ]; then echo 'AMO credentials not set; skipping signing'; exit 0; fi
          sources="$(ls .output/*-sources.zip)"
          if [ "$AMO_CHANNEL" = listed ]; then
            npx web-ext sign --channel listed --amo-metadata docs/store/amo-metadata.json -s .output/firefox-mv3 --upload-source-code "$sources" --approval-timeout 0 -a .output/signed
          else
            npx web-ext sign --channel unlisted -s .output/firefox-mv3 --upload-source-code "$sources" -a .output/signed
          fi
      - name: Upload Firefox ZIPs to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag || inputs.firefox-tag }}
        run: |
          shopt -s nullglob
          gh release upload "$RELEASE_TAG" .output/*-firefox.zip .output/*-sources.zip .output/signed/*.xpi --clobber

  publish-chrome-web-store:
    name: Upload to the Chrome Web Store
    needs: release
    # Stays off until the store item exists and CWS_EXTENSION_ID is set (see docs/store/LISTING.md).
    if: needs.release.outputs.released == 'true' && vars.CWS_EXTENSION_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run zip
      - name: Upload the build
        env:
          EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          npx --yes chrome-webstore-upload-cli@4.0.2 upload --source ".output/vertically-challenged-${RELEASE_VERSION}-chrome.zip"
      - name: Submit for review
        if: vars.CWS_AUTO_PUBLISH == 'true'
        env:
          EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: npx --yes chrome-webstore-upload-cli@4.0.2 publish
