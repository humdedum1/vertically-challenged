name: Bug report
description: Report something that is broken or behaves unexpectedly.
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Search existing issues first. Remove private URLs, browsing history, tokens, and personal data from logs and screenshots. Report security vulnerabilities through the private security link instead.
  - type: input
    id: version
    attributes:
      label: Extension version
      description: Find this on chrome://extensions.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser version and operating system
      placeholder: Chrome 145, Windows 11
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - Unpacked build
        - Signed CRX from a release
        - Other
    validations:
      required: true
  - type: textarea
    id: sync
    attributes:
      label: Sync details (if relevant)
      description: Which tabs/settings are missing? Include device count, automatic interval, Chrome Sync state, Settings sync status/error, and whether Sync now helps. Do not include private URLs or account details.
  - type: dropdown
    id: display
    attributes:
      label: Display mode
      options:
        - Side panel
        - In-page popup
        - Both
        - Unsure
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include how often it happens and whether it follows sleep, a restart, or a long idle period.
      placeholder: |
        1. Open the panel
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: For an unresponsive panel, does Reload panel help? Does the tab only highlight, or does Chrome switch too?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or sanitized logs
      description: Optional. Do not include private browsing data or credentials.
